services:
  - type: web
    runtime: node
    name: ai-compiler-backend
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4
      - key: ANTHROPIC_API_URL
        value: https://api.anthropic.com/v1/messages
      - key: ANTHROPIC_API_VERSION
        value: 2023-06-01
      - key: ANTHROPIC_TIMEOUT_MS
        value: 120000

  - type: web
    runtime: static
    name: ai-compiler-frontend
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ai-compiler-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
